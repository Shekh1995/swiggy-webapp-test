trigger:
  - main

pool:
  name: agent-runner-himanshu2

variables:
  nodeVersion: '20.x'
  buildFolder: 'dist'
  azureServiceConnection: 'himanshu-yt-sc'
  azureWebAppName: 'swiggy-web-app-test1'

steps:

# ============================================================
# 1. Checkout
# ============================================================
- checkout: self
  displayName: 'Checkout source code'


# ============================================================
# 2. Install Node.js
# ============================================================
- task: NodeTool@0
  displayName: 'Install Node.js 20'
  inputs:
    versionSpec: '$(nodeVersion)'


# ============================================================
# 3. Verify Node and npm
# ============================================================
- script: |
    node --version
    npm --version
  displayName: 'Verify Node.js and npm'


# ============================================================
# 4. Install project dependencies
# ============================================================
- script: |
    echo Installing project dependencies...
    npm install --include=dev

    echo.
    echo Installing Vite and React Vite plugin explicitly...
    npm install --save-dev vite@6.0.5 @vitejs/plugin-react@4.3.4

    echo.
    echo Checking installed Vite:
    npm list vite

    echo.
    echo Checking installed React Vite plugin:
    npm list @vitejs/plugin-react

    echo.
    echo Checking Vite executable:
    npx vite --version
  displayName: 'Install dependencies and Vite'


# ============================================================
# 5. Build React application
# ============================================================
- script: |
    echo Building React application...
    npx vite build
  displayName: 'Build React application'


# ============================================================
# 6. Verify build output
# ============================================================
- script: |
    if not exist "$(buildFolder)" (
      echo ERROR: dist directory was not created.
      exit /b 1
    )

    echo.
    echo ========================================
    echo BUILD SUCCESSFUL
    echo ========================================
    echo.

    dir "$(buildFolder)"
  displayName: 'Verify build output'


# ============================================================
# 7. Create deployment ZIP
# ============================================================
- task: ArchiveFiles@2
  displayName: 'Create deployment package'
  inputs:
    rootFolderOrFile: '$(buildFolder)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\foodrush.zip'
    replaceExistingArchive: true


# ============================================================
# 8. Publish artifact
# ============================================================
- task: PublishBuildArtifacts@1
  displayName: 'Publish build artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\foodrush.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'


# ============================================================
# 9. Deploy to Azure Linux Web App
# ============================================================
- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'webAppLinux'
    appName: '$(azureWebAppName)'
    package: '$(Build.ArtifactStagingDirectory)\foodrush.zip'
