trigger:
  - main

pool:
  name: agent-runner-himanshu2

variables:
  nodeVersion: '20.x'
  buildFolder: 'dist'
  azureServiceConnection: 'himanshu-yt-sc'
  azureWebAppName: 'swiggy-web-app-test1'

steps:

# ============================================================
# 1. Checkout source code
# ============================================================
- checkout: self
  displayName: 'Checkout source code'


# ============================================================
# 2. Install Node.js
# ============================================================
- task: NodeTool@0
  displayName: 'Install Node.js 20'
  inputs:
    versionSpec: '$(nodeVersion)'


# ============================================================
# 3. Verify Node.js and npm
# ============================================================
- script: |
    echo ==============================
    echo Node.js Version
    echo ==============================
    node --version

    echo ==============================
    echo NPM Version
    echo ==============================
    npm --version
  displayName: 'Verify Node.js and npm'


# ============================================================
# 4. Install dependencies + Vite
# ============================================================
- script: |
    echo ==============================
    echo Installing project dependencies
    echo ==============================

    npm install --include=dev

    echo.
    echo ==============================
    echo Installing Vite
    echo ==============================

    npm install --save-dev vite@6.0.5 @vitejs/plugin-react@4.3.4

    echo.
    echo ==============================
    echo Checking Vite
    echo ==============================

    npm list vite

    echo.
    echo ==============================
    echo Checking React Vite Plugin
    echo ==============================

    npm list @vitejs/plugin-react

    echo.
    echo ==============================
    echo Vite Version
    echo ==============================

    npx vite --version
  displayName: 'Install dependencies and verify Vite'


# ============================================================
# 5. Build React application
# ============================================================
- script: |
    echo ==============================
    echo Building React application
    echo ==============================

    npx vite build

    echo.
    echo ==============================
    echo React build completed
    echo ==============================
  displayName: 'Build React application'


# ============================================================
# 6. Verify dist folder
# ============================================================
- script: |
    echo ==============================
    echo Verifying build output
    echo ==============================

    if not exist "$(buildFolder)" (
      echo ERROR: dist directory was not created.
      exit /b 1
    )

    echo.
    echo BUILD SUCCESSFUL
    echo.

    dir "$(buildFolder)"
  displayName: 'Verify build output'


# ============================================================
# 7. Create deployment ZIP
# ============================================================
- task: ArchiveFiles@2
  displayName: 'Create deployment package'
  inputs:
    rootFolderOrFile: '$(buildFolder)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\foodrush.zip'
    replaceExistingArchive: true


# ============================================================
# 8. Publish artifact
# ============================================================
- task: PublishBuildArtifacts@1
  displayName: 'Publish build artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\foodrush.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'


# ============================================================
# 9. Deploy to Azure Linux Web App
# ============================================================
- task: AzureWebApp@1
  displayName: 'Deploy FoodRush to Azure Web App'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'webAppLinux'
    appName: '$(azureWebAppName)'
    package: '$(Build.ArtifactStagingDirectory)\foodrush.zip'
    runtimeStack: 'NODE|20-lts'
    startUpCommand: 'pm2 serve /home/site/wwwroot --no-daemon --spa --port 8080'
