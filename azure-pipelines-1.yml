trigger:
  - main

# Azure DevOps self-hosted Linux agent
pool:
  name: agent-runner-himanshu2

variables:
  nodeVersion: '20.x'
  buildFolder: 'dist'
  azureServiceConnection: 'himanshu-yt-sc'
  azureWebAppName: 'YOUR-AZURE-WEBAPP-NAME'

steps:

# 1. Get code from Azure DevOps Repos
- checkout: self
  displayName: 'Checkout source code'

# 2. Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '$(nodeVersion)'

# 3. Install application dependencies
- script: |
    node --version
    npm --version
    npm install
  displayName: 'Install dependencies'

# 4. Build React application
- script: |
    npm run build
  displayName: 'Build React application'

# 5. Verify React build
- script: |
    echo "Checking React build..."
    if [ ! -d "$(buildFolder)" ]; then
      echo "ERROR: $(buildFolder) directory was not created."
      exit 1
    fi

    echo "Build successful."
    ls -la "$(buildFolder)"
  displayName: 'Verify build output'

# 6. Create deployment ZIP
- task: ArchiveFiles@2
  displayName: 'Create deployment package'
  inputs:
    rootFolderOrFile: '$(buildFolder)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/foodrush.zip'
    replaceExistingArchive: true

# 7. Publish pipeline artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish build artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/foodrush.zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'

# 8. Deploy from Azure DevOps to Azure Web App
- task: AzureWebApp@1
  displayName: 'Deploy FoodRush to Azure Web App'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'webAppLinux'
    appName: '$(azureWebAppName)'
    package: '$(Build.ArtifactStagingDirectory)/foodrush.zip'
    runtimeStack: 'NODE|20-lts'
    startUpCommand: 'pm2 serve /home/site/wwwroot --no-daemon --spa'